name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from the `packageManager` field of package.json, through corepack.
      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # System libraries of the Tauri shell (WebKitGTK and friends).
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # apps/desktop/dist is gitignored and Tauri's generate_context requires frontendDist (../dist).
      - run: pnpm --filter @noren/desktop build

      # One step per check, each one run even when an earlier one failed, so a single failure does
      # not hide the results of the others.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: README links
        if: ${{ !cancelled() }}
        run: pnpm readme:check

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Rust format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: Rust clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: pnpm e2e

      - name: Licenses
        if: ${{ !cancelled() }}
        run: pnpm licenses:check
