name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The only runner of this repository is the self-hosted one on the studio VPS (label `noren`).
# Its toolchain (Rust, Node 24 with corepack, cargo-deny, Chromium for Playwright, Tauri system
# libraries) is installed once on the machine, so no step here uses sudo, apt, setup-node or a
# hosted cache. The Cargo target lives outside the workspace so incremental builds survive runs.
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: /home/noren-ci/.cache/noren-target

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, noren]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      # apps/desktop/dist is gitignored and Tauri's generate_context requires frontendDist (../dist).
      - run: pnpm --filter @noren/desktop build

      - run: pnpm verify

      - run: pnpm e2e

      - run: pnpm licenses:check
