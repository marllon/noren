name: Release

# Runs only when a maintainer pushes a tag `v*`. It builds the Linux AppImage and deb and attaches
# them to a DRAFT release; publishing the draft is a manual step on GitHub. The Windows installers
# (NSIS and MSI) are built locally with `pnpm desktop:build` and added to the draft by hand (see
# docs/DEV.md). There is no Windows or macOS job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A second run on the same tag must not cancel a release that is half uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version the manifests carry, or the artifacts would be misnamed.
      - name: Check the tag against the app version
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from the `packageManager` field of package.json, through corepack.
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # System libraries of the Tauri shell (WebKitGTK and friends).
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Targets come from bundle.targets in tauri.conf.json (appimage and deb).
      - run: pnpm desktop:build

      # Draft only: nothing is public until a maintainer publishes it by hand.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Noren $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for the changes in this version." \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb
