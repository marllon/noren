name: Release

# Runs only when a maintainer pushes a tag `v*`. It builds the Linux AppImage and deb and attaches
# them to a DRAFT release; publishing the draft is a manual step on GitHub. The Windows installers
# (NSIS and MSI) are built locally with `pnpm desktop:build` and added to the draft by hand (see
# docs/DEV.md). There is no Windows or macOS job: the only runner of this repository is the
# self-hosted one on the studio VPS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A second run on the same tag must not cancel a release that is half uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Same runner setup as ci.yml: toolchain and Tauri system libraries are installed once on the
# machine, so no step here uses sudo, apt, setup-node or a hosted cache.
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: /home/noren-ci/.cache/noren-target

jobs:
  linux:
    name: linux
    runs-on: [self-hosted, linux, noren]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version the manifests carry, or the artifacts would be misnamed.
      - name: Check the tag against the app version
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Targets come from bundle.targets in tauri.conf.json (appimage and deb).
      - run: pnpm desktop:build

      # Draft only: nothing is public until a maintainer publishes it by hand.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Noren $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for the changes in this version." \
            "$CARGO_TARGET_DIR"/release/bundle/appimage/*.AppImage \
            "$CARGO_TARGET_DIR"/release/bundle/deb/*.deb
