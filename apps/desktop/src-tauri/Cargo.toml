[package]
name = "noren"
description = "Noren desktop app (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noren-core = { path = "../../../crates/noren-core" }
# The link to the session daemon (`daemon_link.rs`) drives the async client of noren-core from a
# runtime of its own with two worker threads, so the app needs the multi-thread flavour of it
# (`rt-multi-thread`), the queues between the callers and the task that reads the connection
# (`sync`), `select!` (`macros`) and the waits (`time`). Already in the tree through Tauri and
# noren-core; 1.53.3, MIT.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
# `tray-icon`: the icon in the notification area with "Open" and "Quit" (`tray.rs`), which is what
# lets closing the window leave the app (and the shells in `norend`) running. Its own crate,
# `tray-icon` 0.25.1 (MIT OR Apache-2.0), was already in the lockfile; on Linux it loads the
# appindicator library at run time (a system without it gets no icon, see `tray::install`).
# `unstable`: `Window::add_child`, which puts the web view of a browser pane (`browser_pane.rs`) inside
# the main window next to the page of the app. A feature of Tauri itself (it enables the same
# feature of `tauri-runtime-wry`), no new crate; the lockfile does not change.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
# Derive macros for the command DTOs (profile list, session-exit payload, write payload).
# Already in the dependency tree through Tauri; MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
# Needed by tauri::generate_context! once tauri.conf.json has a plugins section (the plugin
# configuration is embedded as JSON). Already in the dependency tree through Tauri; MIT OR Apache-2.0.
serde_json = "1"
# Receives the noren:// links: the plugin is what lets tauri.conf.json declare the scheme that the
# installer registers (no runtime registration is done), and it delivers links on macOS.
# 2.6.2, Apache-2.0 OR MIT.
tauri-plugin-deep-link = "2"
# A second launch (a link clicked while Noren is open) hands its arguments to the running
# instance and exits, instead of opening a second window. 2.5.4, Apache-2.0 OR MIT.
tauri-plugin-single-instance = "2"
# Shows the notification of the system (a program rang the bell with the window out of focus, a
# long command ended out of sight). Only the Rust side is used, from the `notify_show` command; the
# JavaScript package is not added and the plugin's own commands get no capability, so the page
# cannot call them. 2.7.0, MIT OR Apache-2.0.
tauri-plugin-notification = "2"
# Paints Mica, Acrylic or macOS vibrancy behind the main window. Tauri uses the crate too
# (`WebviewWindow::set_effects`), but that call drops the result, and the log and the settings
# screen have to say whether the system painted the effect or the window fell back to opaque, so
# the calls are made here. Already in the lockfile through Tauri; 0.8.1, Apache-2.0 OR MIT.
window-vibrancy = "0.8"
# The global shortcut (Ctrl+` by default) that shows and hides the quick terminal window. Only the
# Rust side is used (`shortcut.rs`); the JavaScript package is not added and the plugin's own
# commands get no capability, so the page cannot register anything itself. 2.4.1 (global-hotkey
# 0.8.0 underneath), Apache-2.0 OR MIT.
tauri-plugin-global-shortcut = "2"
# The update of the app itself (`update.rs`): it reads the feed in the format of the Tauri updater
# (one version, and a signature and an address per platform), picks the entry of this platform,
# decides whether the version is newer, checks the minisign signature of the downloaded package
# against the public key in tauri.conf.json (plugins > updater), and runs the installer of the
# system. Only the Rust side is used; the JavaScript package is not added and the plugin's own
# commands get no capability, so the page cannot call them. The feed and the package are fetched by
# `noren_core::update` (so they have a ceiling and a deadline), which hands the plugin the feed to
# decide on (`Updater::restore_update`) and the bytes to verify and install. The default features
# are off: `rustls-tls` would bring a second TLS stack (rustls with ring) next to the system one
# the rest of the app uses, `system-proxy` is for requests the plugin makes itself, and `zip` is
# only for packages in the format of Tauri 1. `native-tls` is the system stack of the other
# requests of the app (the AI providers, the gallery, the sync): the plugin makes no request here,
# but one that could not speak TLS would be a trap for whoever calls it. New in the tree with it:
# minisign-verify 0.3.0 (MIT), tar 0.4.46 (MIT OR Apache-2.0), filetime 0.2.29 (MIT OR Apache-2.0),
# xattr 1.6.1 (MIT OR Apache-2.0), osakit 0.3.1 (MIT OR Apache-2.0) and objc2-osa-kit 0.3.2
# (Zlib OR Apache-2.0 OR MIT), the last two for macOS only. 2.14.0, Apache-2.0 OR MIT.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls"] }

# The file chooser of the system (the Windows one on Windows) for the background picture: the
# "Choose image..." buttons of the settings screen and of the background dialog of a space ask for
# it through `background_image_pick` (`bridge.rs`). Only the Rust side is used; the JavaScript
# package is not added and the plugin's own commands get no capability, so the page can ask for
# this one command, which lists pictures and answers a path, and nothing else (no save, message or
# read-a-file command). The chosen path goes back through `background_image_read`, which checks it
# again. Defaults kept: on Linux the chooser needs GTK, which the web view already needs. New in the
# tree with it: rfd 0.16.0 (MIT, the chooser itself) and tauri-plugin-fs 2.7.1 (Apache-2.0 OR MIT,
# which the plugin needs to scope what it hands over; it is not added to the app, so the page gets
# no file command from it). 2.8.3, Apache-2.0 OR MIT.
tauri-plugin-dialog = "2"

# Hands an http or https address the person confirmed to the browser of the system (`link.rs`, the
# only caller, which checks the address first). Chosen over the Tauri opener plugin because it has
# no commands for the page to be granted: the page can ask for this one command and nothing else.
# 5.4.4, MIT.
open = "5"

[target.'cfg(windows)'.dependencies]
# The picture of the real window (`smoke_shot.rs`, `noren --smoke-shot`) is taken by the web view
# itself: `ICoreWebView2::CallDevToolsProtocolMethod` with `Page.captureScreenshot`, a call inside
# the process (no debugging port, no capture of the desktop). `Webview::with_webview` hands over the
# WebView2 controller as a type of this crate, and the completion handler of that call is built from
# it. Already in the lockfile through Tauri and wry, same version they use; 0.39.1, MIT.
webview2-com = "0.39"
# The same mode asks the system (the window in front of the others, read only; the style, the place
# and the show of the window of the run, never its focus) with the types WebView2 and Tauri use.
# Already in the lockfile through Tauri, wry and webview2-com, same version; the three features are
# already switched on by Tauri and tao, so nothing new is compiled. 0.62.2, MIT OR Apache-2.0.
# `Win32_System_Registry` is for one read only call (`window_effect::transparency_reduced`): the
# "Transparency effects" switch of Windows, which the glass interface style obeys even where the web
# view does not report it as `prefers-reduced-transparency`. A feature of the same crate, no new crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The mock runtime of `tauri::test`, so the tests can call a command through the same path the
# page uses (the name of the command and of its arguments, the raw answer). A feature of the crate
# above, no new crate.
tauri = { version = "2", features = ["test"] }
# `#[tokio::test]` for the AI command tests, which drive an async client against a server on
# 127.0.0.1, and a stream in memory (`io-util`) for the daemon the replay tests play themselves.
# Already in the tree through Tauri and noren-core; 1.53.3, MIT.
tokio = { version = "1.53.3", features = ["rt", "time", "macros", "io-util"] }
