[package]
name = "noren"
description = "Noren desktop app (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noren-core = { path = "../../../crates/noren-core" }
tauri = { version = "2", features = [] }
# Derive macros for the command DTOs (profile list, session-exit payload, write payload).
# Already in the dependency tree through Tauri; MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
