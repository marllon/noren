[package]
name = "noren-core"
description = "Noren core library: PTY, profiles, config, persistence, git and AI (no Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Lists the monospaced font families installed on the machine, for the font setting of the terminal:
# it scans the system font folders (Windows, macOS, Linux and the fonts of the user) and reads the
# names and the fixed-pitch flag of each font file, which is all the settings need and which the
# page cannot do (a WebView lists no installed fonts without asking the user for permission). It
# carries its own font-name parser, so it adds only memmap2 and slotmap besides what is already in
# the tree. The default `fontconfig` feature is off: it only changes how Linux finds the folders
# and would add a fontconfig parser; the known folders are scanned instead. 0.24.0, MIT (memmap2
# 0.9.11: MIT OR Apache-2.0; slotmap 1.1.1: Zlib).
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
# Watches the folder of config.jsonc so an edit made outside the app (an editor, a script) reaches
# the interface without a restart: the OS notification APIs (ReadDirectoryChangesW, inotify,
# FSEvents) instead of polling the file. 8.2.0, CC0-1.0.
notify = "8.2.0"
portable-pty = "0.9.0"
# Takes the picture of the process tree (pid, parent, name, command line) that the agent detector
# reads (`agents` module): there is no other portable way to list the descendants of a shell on
# Windows, macOS and Linux. Only the `system` feature is on, so the CPU, disk, network and
# component readers (and rayon) are not built; the processes are the one thing asked for.
# 0.39.6, MIT. New in the tree: ntapi 0.4.3 (Apache-2.0 OR MIT, Windows) and objc2-io-kit 0.3.2
# (Zlib OR Apache-2.0 OR MIT, macOS); libc, memchr, windows and objc2-core-foundation were already
# there.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# HTTP client of the AI providers (`ai` module): requests with a streamed response body, read
# chunk by chunk for the SSE stream. 0.13.5, MIT OR Apache-2.0 (already in the tree through Tauri).
# The default features are off because the default TLS (rustls with aws-lc-rs) brings aws-lc-sys
# (OpenSSL license) and webpki-roots (CDLA-Permissive-2.0), both outside the license list.
# `native-tls` uses the TLS stack of the system (SChannel on Windows, Secure Transport on macOS,
# OpenSSL on Linux) and its certificate roots, so a corporate or local CA works too; the crates
# are MIT or Apache-2.0. `stream` gives `Response::bytes_stream`.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
# Reads and builds the JSON of the provider APIs (the stream events, the request body, the list of
# models of Ollama) as untyped values, so no derive macro is added. 1.0, MIT OR Apache-2.0
# (already in the tree through Tauri).
serde_json = "1"
# Runtime of the AI client (reqwest is async, and `time` gives the timeouts) and of the session
# daemon (`daemon` module). The AI client is driven from a runtime the caller owns; the tests build
# a small current-thread one. The daemon needs three more features and nothing else: `net` for the
# local IPC (named pipes on Windows, Unix domain sockets elsewhere, which std cannot create),
# `io-util` for the async reads and writes of the length-prefixed frames, and `sync` for the
# queues between the connection tasks. No multi-thread runtime: the daemon runs a current-thread
# one and hands the blocking PTY calls to the blocking pool. `process` is for the `ssh` of the
# remote daemon (`daemon::ssh`): its standard streams are the connection, read and written
# asynchronously, and it is ended when the handle is dropped; std's `Child` has neither. It adds
# no crate (mio, libc and signal-hook-registry on Unix, windows-sys on Windows are already in the
# tree). 1.53.3, MIT (already in the tree through Tauri).
tokio = { version = "1.53.3", features = ["rt", "time", "macros", "net", "io-util", "sync", "process"] }
# `CancellationToken`: stops a request from another thread and wakes the stream that is waiting
# for the next chunk. 0.7.20, MIT (already in the tree through Tauri).
tokio-util = { version = "0.7.20", default-features = false }
# futures-util's `StreamExt::next` over the body stream. 0.3, MIT OR Apache-2.0 (already in the
# tree through Tauri).
futures-util = { version = "0.3", default-features = false }

# The API keys of the AI providers live in the keychain of the system, never in a file (`vault`
# module). `keyring` 3.6.3 (MIT OR Apache-2.0) is one small API over the native store of each
# system; only the native backends are turned on, one table per system, so no backend that keeps
# the secret in a file or in a database is built in. Windows: Credential Manager
# (windows-native adds windows-sys and byteorder, MIT OR Apache-2.0 and Unlicense OR MIT).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
# The named pipe of the session daemon must be usable by the current user only: tokio can create a
# pipe with a security descriptor of our own (`create_with_security_attributes_raw`) but offers no
# way to build one, so the user's SID is read from the process token and turned into a DACL with
# these calls (`daemon::ipc`). 0.61.2, MIT OR Apache-2.0 (already in the tree through tokio and
# Tauri; only four Win32 feature flags are added to it).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
# macOS: the Keychain, through security-framework (already in the tree through Tauri).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
# Linux and the other Unixes: the Secret Service (GNOME Keyring, KWallet) over D-Bus, through the
# pure Rust `secret-service` and zbus (zbus is already in the tree through Tauri) with the Rust
# crypto, so no system library (libdbus, OpenSSL) is needed to build it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "crypto-rust"] }

# The socket of the session daemon sits in a folder that must belong to the current user and be
# closed to everyone else, so the daemon needs the effective user id (`geteuid`), which std does
# not expose (`daemon::ipc`). 0.2, MIT OR Apache-2.0 (already in the tree through tokio, portable-pty
# and sysinfo).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
