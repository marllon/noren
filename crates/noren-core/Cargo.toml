[package]
name = "noren-core"
description = "Noren core library: PTY, profiles, config, persistence, git and AI (no Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Lists the monospaced font families installed on the machine, for the font setting of the terminal:
# it scans the system font folders (Windows, macOS, Linux and the fonts of the user) and reads the
# names and the fixed-pitch flag of each font file, which is all the settings need and which the
# page cannot do (a WebView lists no installed fonts without asking the user for permission). It
# carries its own font-name parser, so it adds only memmap2 and slotmap besides what is already in
# the tree. The default `fontconfig` feature is off: it only changes how Linux finds the folders
# and would add a fontconfig parser; the known folders are scanned instead. 0.24.0, MIT (memmap2
# 0.9.11: MIT OR Apache-2.0; slotmap 1.1.1: Zlib).
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
# Watches the folder of config.jsonc so an edit made outside the app (an editor, a script) reaches
# the interface without a restart: the OS notification APIs (ReadDirectoryChangesW, inotify,
# FSEvents) instead of polling the file. 8.2.0, CC0-1.0.
notify = "8.2.0"
portable-pty = "0.9.0"
# HTTP client of the AI providers (`ai` module): requests with a streamed response body, read
# chunk by chunk for the SSE stream. 0.13.5, MIT OR Apache-2.0 (already in the tree through Tauri).
# The default features are off because the default TLS (rustls with aws-lc-rs) brings aws-lc-sys
# (OpenSSL license) and webpki-roots (CDLA-Permissive-2.0), both outside the license list.
# `native-tls` uses the TLS stack of the system (SChannel on Windows, Secure Transport on macOS,
# OpenSSL on Linux) and its certificate roots, so a corporate or local CA works too; the crates
# are MIT or Apache-2.0. `stream` gives `Response::bytes_stream`.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
# Reads and builds the JSON of the provider APIs (the stream events, the request body, the list of
# models of Ollama) as untyped values, so no derive macro is added. 1.0, MIT OR Apache-2.0
# (already in the tree through Tauri).
serde_json = "1"
# Runtime of the AI client: reqwest is async, and `time` gives the timeouts. The client is driven
# from a runtime the caller owns; the tests build a small current-thread one. 1.53.3, MIT
# (already in the tree through Tauri).
tokio = { version = "1.53.3", features = ["rt", "time", "macros"] }
# `CancellationToken`: stops a request from another thread and wakes the stream that is waiting
# for the next chunk. 0.7.20, MIT (already in the tree through Tauri).
tokio-util = { version = "0.7.20", default-features = false }
# futures-util's `StreamExt::next` over the body stream. 0.3, MIT OR Apache-2.0 (already in the
# tree through Tauri).
futures-util = { version = "0.3", default-features = false }
